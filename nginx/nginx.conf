# Reverse proxy configuration for pdf-utility
#
# Host routing:
#   pdf.farzani.my.id  -> the PDF utility application
#   everything else    -> 503 maintenance page (apex, www, unknown hosts)
#
# Requests that match no server_name fall through to the default_server,
# which is the maintenance block. The liveness probe must keep answering on
# any Host (the container healthcheck calls it as 127.0.0.1).

# Required by the proxy_set_header Connection directive below.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------------------
# HTTP : redirect to HTTPS, keeping ACME and the liveness probe reachable.
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Allow an ACME HTTP-01 challenge if Let's Encrypt is added later.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Internal liveness probe used by the container healthcheck. Answers on
    # any Host, including the bare 127.0.0.1 the healthcheck requests.
    location /nginx-health {
        access_log off;
        default_type text/plain;
        types { }
        return 200 "ok";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS : the PDF subdomain — the only host routed to the application.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pdf.farzani.my.id;

    ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Maximum file upload size: match or exceed MAX_FILE_SIZE_MB in .env
    client_max_body_size 100M;
    client_body_buffer_size 16M;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        types { }
        return 200 "ok";
    }

    location / {
        proxy_pass http://app:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # WebSocket / Keep-Alive
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Long timeouts for heavy PDF processing (merge/compress of large files)
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Disable buffering for uploads so memory stays low on the proxy
        proxy_request_buffering off;
        proxy_buffering off;
    }
}

# ---------------------------------------------------------------------------
# HTTPS : default — apex domain (farzani.my.id), www, and unknown hosts.
# Serves the maintenance page with a 503.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /etc/nginx/maintenance;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Retry-After "3600" always;

    location / {
        return 503;
    }

    error_page 503 /maintenance.html;

    location = /maintenance.html {
        internal;
    }

    # Keep crawlers away while the site is down.
    location = /robots.txt {
        default_type text/plain;
        types { }
        return 200 "User-agent: *\nDisallow: /\n";
    }
}
