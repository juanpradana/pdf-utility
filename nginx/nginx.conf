# Reverse proxy configuration for pdf-utility
# Optimized for self-hosted PDF processing behind Cloudflare or directly.

# Required by the proxy_set_header Connection directive below.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name pdf.farzani.my.id _;

    # Allow ACME HTTP-01 challenge if someone wants Let's Encrypt later.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Internal liveness probe used by the container healthcheck.
    location /nginx-health {
        access_log off;
        default_type text/plain;
        types { }
        return 200 "ok";
    }

    # Redirect all plain HTTP to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pdf.farzani.my.id _;

    ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Maximum file upload size: match or exceed MAX_FILE_SIZE_MB in .env
    client_max_body_size 100M;
    client_body_buffer_size 16M;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://app:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # WebSocket / Keep-Alive
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Long timeouts for heavy PDF processing (merge/compress of large files)
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Disable buffering for uploads so memory stays low on the proxy
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
