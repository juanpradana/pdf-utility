<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sedang Dalam Perbaikan</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 1rem;
    background: radial-gradient(circle at 50% 0%, #16204a 0%, #0b1020 55%);
    color: #e7ecff;
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    max-width: 32rem;
    padding: 2.5rem 2rem;
    text-align: center;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 1.25rem;
    background: rgba(255, 255, 255, 0.04);
    backdrop-filter: blur(12px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
  }
  .badge {
    display: inline-block;
    padding: 0.3rem 0.8rem;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: rgba(255, 196, 0, 0.15);
    color: #ffd166;
  }
  h1 { margin: 1.1rem 0 0.5rem; font-size: 1.55rem; line-height: 1.3; }
  p { margin: 0.5rem 0; color: #a8b3d4; font-size: 0.95rem; }
  a { color: #8ab4ff; }
  .divider {
    height: 1px;
    margin: 1.5rem 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
  }
</style>
</head>
<body>
  <main class="card">
    <span class="badge">503</span>
    <h1>Sedang Dalam Perbaikan</h1>
    <p>Situs ini sedang dalam pemeliharaan terjadwal. Silakan coba beberapa saat lagi.</p>
    <div class="divider"></div>
    <p>Layanan pemrosesan PDF tetap tersedia di<br><a href="https://pdf.farzani.my.id">pdf.farzani.my.id</a></p>
  </main>
</body>
</html>
