services:
  # ---------------------------------------------------------------------------
  # Application — Node/Express PDF utility. Not published to the host; it is
  # only reachable from the proxy over the internal network.
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: pdf-utility:latest
    container_name: pdf-utility-app
    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: "3001"
      UPLOAD_DIR: /data/uploads
      OUTPUT_DIR: /data/outputs
      # Requests arrive through the bundled Nginx proxy.
      TRUST_PROXY: "true"

    volumes:
      - pdf-data:/data

    networks:
      - pdf-internal

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/api/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 128M

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Reverse proxy — terminates TLS (self-signed) and forwards to the app.
  # This is the only service exposed to the internet.
  # ---------------------------------------------------------------------------
  proxy:
    image: nginx:1.27-alpine
    container_name: pdf-utility-proxy
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/maintenance.html:/etc/nginx/maintenance/maintenance.html:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # Serves ACME HTTP-01 challenges written by init-letsencrypt.sh.
      # Certbot's own store stays out of this container: nginx only ever
      # needs the already-installed server.crt / server.key above.
      - ./nginx/certbot-www:/var/www/certbot:ro

    depends_on:
      app:
        condition: service_healthy

    networks:
      - pdf-internal

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pdf-data:
    driver: local

networks:
  pdf-internal:
    driver: bridge